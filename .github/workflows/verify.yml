name: Verify site
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: hugo --minify --gc
      - run: npm test
      - name: Test release packaging
        run: python3 -m unittest tests/test_package_release.py
      - name: Package immutable site release
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")" \
            python3 scripts/package_release.py \
              --public public \
              --output release-bundle \
              --repository "$GITHUB_REPOSITORY" \
              --run-id "$GITHUB_RUN_ID" \
              --sha "$GITHUB_SHA"
      - name: Upload immutable site release
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: site-release-${{ github.sha }}
          path: release-bundle
          if-no-files-found: error
          retention-days: 30
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence
          path: test-results
          if-no-files-found: ignore
